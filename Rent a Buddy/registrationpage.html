        <div class="container">
            <form class="col-md-12 form_tag">
                <div class="register_holder">
                    <div class="row content_holder">
                        <div class="side_img col-md-3">
                            <div class="context_holder">
                                Sign Up to The Home of Japanese and Korean Cuisine
                            </div>
                        </div>
                        <div class="container-fluid col-md-9 registration_input_holder">
                            <div class="row name_holder mb-2 mt-2">
                                <div class="firstname_holder col-md-4">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" class="form-control" placeholder="Last Name">
                                </div> 
                                <div class="secondname_holder col-md-4">
                                    <label class="form-label">First Name</label>
                                    <input type="text" class="form-control" placeholder="First Name">
                                </div>
                                <div class="middlename_holder col-md-4">
                                    <label class="form-label">Middle Name</label>
                                    <input type="text" class="form-control" placeholder="Middle Name">
                                </div>
                            </div>
                            <div class="row adress_age_holder mb-2 mt-2">
                                <div class="secondname_holder col-md-5">
                                    <label class="form-label">Address</label>
                                    <input type="text" class="form-control" placeholder="Address">
                                </div>
                                <div class="secondname_holder col-md-7">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" placeholder="Email">
                                </div>
                                
                            </div>
                            <div class="row email_contact_number_holder mb-2 mt-2">
                                <div class="contact_number_holder col-md-6">
                                    <label class="form-label">Contact Number</label>
                                    <div class="contact_number_input_holder">
                                        <div class="select_holder">
                                            <select>
                                                <option>PH +63</option>
                                                <option>US +1</option>
                                                <option>CA +1</option>
                                                <option>UK +44</option>
                                                <option>AU +61</option>
                                                <option>DE +49</option>
                                                <option>FR +33</option>
                                                <option>JP +81</option>
                                                <option>IN +91</option>
                                                <option>BR +55</option>
                                                <option>ZA +27</option>
                                            </select>
                                        </div>
                                        
                                        <div class="input_holder">
                                            <input class="form-control" placeholder="XXXXXXXXXX">
                                        </div>
                                    </div>
                                </div>

                                <div class="secondname_holder col-md-4">
                                    <label class="form-label">Birthdate</label>
                                    <input type="date" class="form-control" placeholder="Email">
                                </div>

                                <div class="middlename_holder col-md-2 ">
                                    <label class="form-label">Age</label>
                                    <input type="number" class="form-control" placeholder="Age">
                                </div>


                            </div>
                            <div class="row mb-2 mt-2">
                                <div class="inputs_holder col-md-6 mb-2">
                                  <div class="middlename_holder col-md-12 mb-2">
                                        <label class="form-label">Valid ID</label>
                                        <input type="file" class="form-control" name="images[]" accept="image/*" multiple>
                                    </div>
                                    <div class="Username_holder col-md-12 mb-2">
                                        <label class="form-label">Username</label>
                                        <input type="text" class="form-control" placeholder="Username">
                                    </div> 
                                    <div class="secondname_holder col-md-12 mb-2">
                                        <label class="form-label">Password</label>
                                        <input type="password" class="form-control" placeholder="Password">
                                    </div>
                                </div>
                                <div class="buttons_holder col-md-6">
                                    <div class="terms_of_services_holder">
                                        <label class="mt-4">
                                            By creating or using an account, you agree to our
                                            <br> 
                                            <a href="#">
                                                Terms of Use
                                            </a> 
                                             and 
                                            <a href="#">
                                                Privacy Policy
                                            </a>
                                            <div class="checkbox_holder mt-3">
                                                <div class="remember_me_holder mt-2 mb-2">
                                                    <input type="checkbox" id="agree1" class="form-check-input">
                                                    <label class="form-label">Yes, I Agree to the Terms of Use. </label>
                                                </div>
                                                <div class="remember_me_holder mt-2 mb-2">
                                                    <input type="checkbox" id="agree2" class="form-check-input">
                                                    <label class="form-label">Yes, I Agree to the Privacy Policy.</label>
                                                </div>
                                                <div class="loginlink_holder mt-2">
                                                    <label>
                                                        Already Have an Account?
                                                        <a href="loginpage.html" onClick="">Login</a> 
                                                    </label>
                                                </div>
                                            </div>
                                        </label>
                                        
                                    </div>
                                </div>
                                <div class="buttons_holder main-button">
                                    <div class="register_holder col-md-12">
                                        <button href="#" id="register" class="btn">Register</button>
                                    </div> 
                                </div>
                                


                            </div>
                        </div>
                    </div>
                </div>
